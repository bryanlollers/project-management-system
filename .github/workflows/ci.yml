name: Application checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - connection: sqlite
            database: ':memory:'
          - connection: pgsql
            database: pms_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pms_test
          POSTGRES_USER: pms_test
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms_test -d pms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_DATABASE: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: pms_test
      DB_PASSWORD: local_test_only
      DB_SSLMODE: disable
      DB_SCHEMA: public
      DB_URL: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
      - run: composer format:check
      - run: composer audit
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Report known frontend dependency advisories
        run: npm audit --audit-level=high
        continue-on-error: true
