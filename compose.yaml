services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms_dev
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pms
      DB_USERNAME: pms
      DB_PASSWORD: pms_dev
      DB_SCHEMA: pms
      DB_SSLMODE: disable
      DB_URL: ""
      SEED_DEMO: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config
      - ./backend/routes:/app/routes
      - ./backend/database:/app/database
      - ./backend/tests:/app/tests
      - api-storage:/app/storage
      - api-config:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_PROXY_TARGET: http://api:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - api
volumes:
  postgres-data:
  api-storage:
  api-config:
