services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orbit
      MYSQL_USER: orbit
      MYSQL_PASSWORD: orbit_dev
      MYSQL_ROOT_PASSWORD: root_dev
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: orbit
      DB_USERNAME: orbit
      DB_PASSWORD: orbit_dev
      SEED_DEMO: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config
      - ./backend/routes:/app/routes
      - ./backend/database:/app/database
      - ./backend/tests:/app/tests
      - api-storage:/app/storage
      - api-config:/app/runtime
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_PROXY_TARGET: http://api:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - api
volumes:
  mysql-data:
  api-storage:
  api-config:
