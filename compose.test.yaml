name: project-management-postgres-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pms_test
      POSTGRES_USER: pms_test
      POSTGRES_PASSWORD: local_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pms_test -d pms_test']
      interval: 2s
      timeout: 5s
      retries: 20
  tests:
    build: ./backend
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pms_test
      DB_USERNAME: pms_test
      DB_PASSWORD: local_test_only
      DB_SCHEMA: pms
      DB_SSLMODE: disable
      DB_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [sh, -c]
    command:
      - >-
        cp .env.example .env
        && php -r '$$pdo = new PDO("pgsql:host=postgres;dbname=pms_test", "pms_test", "local_test_only"); $$pdo->exec("CREATE SCHEMA IF NOT EXISTS pms");'
        && php artisan test
