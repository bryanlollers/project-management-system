name: project-management-mysql-tests
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: local_test_root_only
      MYSQL_DATABASE: pms_test
      MYSQL_USER: pms_test
      MYSQL_PASSWORD: local_test_only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u pms_test -D pms_test -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 20
  tests:
    build: ./backend
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pms_test
      DB_USERNAME: pms_test
      DB_PASSWORD: local_test_only
      DB_URL: ''
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: [sh, -c]
    command:
      - >-
        cp .env.example .env
        && php artisan test
