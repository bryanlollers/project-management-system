name: project-management-production
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      APP_NAME: Project Management System
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?Set APP_KEY in deploy/.env}
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
      TRUSTED_PROXIES: '*'
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:?Set the Supabase session pooler host}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-postgres}
      DB_USERNAME: ${DB_USERNAME:?Set the Supabase database username}
      DB_PASSWORD: ${DB_PASSWORD:?Set the Supabase database password}
      DB_SCHEMA: pms
      DB_SSLMODE: require
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: 'true'
      QUEUE_CONNECTION: sync
    volumes:
      - api-storage:/var/www/html/storage
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8080/api
      NUXT_PUBLIC_DEMO_LOGIN: 'false'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  api-storage:
  caddy-data:
  caddy-config:
